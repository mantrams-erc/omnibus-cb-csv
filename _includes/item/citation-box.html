{% comment %}

    Adds a basic citation box for the item with reference link to the item page.

{%- endcomment -%}
<div class="card mt-2">
    <div class="card-header fw-bold border-0">Attribution</div>
    <div class="card-body fw-light">
        <dl>
            <dt>Citation:</dt>
            <dd class="small">"{{ page.title }}", {{ site.title }}, {% if site.organization-name %}{{ site.organization-name }}, {% endif %}<a href="{{ page.url | absolute_url }}">{{ page.url | absolute_url }}</a></dd>
        </dl>
    </div>
</div>
